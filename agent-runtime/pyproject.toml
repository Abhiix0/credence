[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agent-runtime"
version = "0.1.0"
description = "Autonomous Agent Economy worker daemon and reasoning runtime for Monad testnet"
authors = [{ name = "Autonomous Agent Economy Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=6.15.0",
    "pydantic>=2.5.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
